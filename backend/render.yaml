services:
  - type: web
    name: campusconnect-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        value: CampusConnectDB
      - key: DB_PORT
        value: 1433
      - key: DB_ENCRYPT
        value: true
      - key: JWT_SECRET
        generateValue: true
